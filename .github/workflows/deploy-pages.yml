name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web panels
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Build customer app (web preview)
        working-directory: mobile
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/app
          EXPO_PUBLIC_DEMO_MODE: '1'
        run: |
          npm ci
          npx expo export --platform web --output-dir dist

      - name: Assemble site
        run: |
          mkdir -p site/app
          cp -r web/dist/. site/
          cp -r mobile/dist/. site/app/
          cp deploy/404.html site/404.html
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
